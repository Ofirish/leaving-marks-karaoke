<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke</title>
<meta name="theme-color" content="#1d1f24">
<style>
:root{--base:#ffffff8c;--hi:#ffd166;--size:44px;--accent:#ffd166;--panel:#121317f0;--btn:#ffffff14;--btnb:#ffffff2e;--txt:#f1f1f1;--mut:#ffffffa0;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew","Arial Hebrew","David",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:var(--font);color:var(--txt);background:#1d1f24}
#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0}
#bg{position:fixed;inset:0;background:#2b2b2e;background-size:cover;background-position:center;z-index:0}
#shade{position:fixed;inset:0;background:#000;opacity:0;z-index:1;pointer-events:none}

/* top bar: title, YouTube link, settings */
#top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
#title{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
a.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;background:#d62d20;border-radius:999px;padding:7px 12px 7px 9px;font-size:14px;font-weight:600;white-space:nowrap}
a.yt svg{width:20px;height:14px;flex:none}
a.yt:hover{background:#ee3b2e}

/* lyrics */
#stage{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:.5em;padding:12px 4vw;text-align:center;--fs:min(var(--size),9vw,12vh)}
#stage::before,#stage::after{content:"";flex:1 0 0}
#stage>div{flex-shrink:0}
.line{flex-shrink:0;font-size:calc(var(--fs)*.62);color:var(--base);line-height:1.35;cursor:pointer;min-height:1.35em;max-width:92vw;overflow-wrap:anywhere}
.line.cur{font-size:var(--fs);font-weight:700}
.line.prev{opacity:.45}
.line.sec{font-size:calc(var(--fs)*.55);opacity:.85;margin-top:-.2em}
.line.cur.sec{font-size:calc(var(--fs)*.6);font-weight:600}
.w.harsh{--hi:#ff2a2a;--base:#8a1f1f}
.w{background-image:linear-gradient(to right,var(--hi) calc(var(--p,0)*100%),var(--base) calc(var(--p,0)*100%));-webkit-background-clip:text;background-clip:text;color:transparent}
[dir=rtl] .w{background-image:linear-gradient(to left,var(--hi) calc(var(--p,0)*100%),var(--base) calc(var(--p,0)*100%))}
#loading{opacity:.7;font-size:15px}

/* control panel */
#bar{flex:0 0 auto;background:var(--panel);backdrop-filter:blur(8px);border-top:1px solid #ffffff1a;display:flex;flex-direction:column;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#seekRow{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut)}
#seek{flex:1;min-width:0;height:28px}
input[type=range]{accent-color:var(--accent)}
button,select{font:inherit;color:var(--txt);background:var(--btn);border:1px solid var(--btnb);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover,select:hover{background:#ffffff22}
button:active{transform:scale(.97)}
select option{color:#000}
.ico{font-size:1.05em;line-height:1}
#transport{display:grid;grid-template-columns:1fr 1.3fr 1fr 1.2fr;gap:8px}
#play{background:var(--accent);color:#1b1b1b;border-color:transparent;font-weight:700;font-size:17px}
#play:hover{background:#ffe08f}
button.on{background:var(--accent);color:#1b1b1b;border-color:transparent;font-weight:600}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.grp>.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding-left:2px}
.seg{display:flex;border:1px solid var(--btnb);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1 1 0;min-width:0;background:var(--btn);padding:8px 10px}
.seg button+button{border-left:1px solid var(--btnb)}
.seg button.on{background:var(--accent);color:#1b1b1b}
#voiceGrp{flex:2 1 190px}
#speedGrp{flex:1 1 130px}
#speed{display:flex;align-items:center;border:1px solid var(--btnb);border-radius:10px;overflow:hidden}
#speed button{border:0;border-radius:0;width:44px;font-size:20px;padding:0;flex:none}
#spdV{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;min-width:3.2em}
#lyrGrp{flex:1 1 150px}
#lyrSel{width:100%}
#recGrp{flex:0 1 auto}
#recGrp .btns{display:flex;gap:8px}
#recGrp .btns button{flex:1 1 0;min-width:0}
button.rec{background:#c0392b;color:#fff;border-color:transparent}
#hint{font-size:13px;color:var(--mut);text-align:center;min-height:1em}
#hint:empty{display:none}

/* settings drawer */
#scrim{position:fixed;inset:0;background:#0008;z-index:9;display:none}
#scrim.open{display:block}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);z-index:10;background:#151518f7;backdrop-filter:blur(8px);border-left:1px solid #ffffff22;padding:12px 16px calc(24px + env(safe-area-inset-bottom));font-size:15px;overflow-y:auto;overscroll-behavior:contain;transform:translateX(105%);transition:transform .2s;visibility:hidden}
#panel.open{transform:none;visibility:visible}
#panelHead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:#151518;padding:6px 0;z-index:1}
#panelHead b{font-size:17px}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:10px;flex-wrap:wrap}
#panel label>input[type=range]{flex:1 1 120px;max-width:180px}
#panel input[type=text],#panel input[type=file]{max-width:100%;min-width:0;flex:1 1 140px}
#panel h4{margin:18px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.6}
#panel button{min-height:38px;padding:6px 12px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets span{width:34px;height:34px;border-radius:6px;cursor:pointer;border:1px solid #fff4}
.keys{opacity:.6;font-size:13px;line-height:1.6;margin-top:16px}

@media (max-width:560px){
  #setBtn .t,.ytl{display:none}
  #setBtn{padding:7px 10px}
  button,select{font-size:14px;padding:7px 8px}
  #title{font-size:13px}
  a.yt{padding:6px 10px 6px 8px;font-size:13px}
  #bar{gap:8px}
  .row{gap:8px}
}
@media (max-height:520px){
  #top{padding-top:4px;padding-bottom:2px}
  #bar{gap:6px;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  button,select{min-height:36px;padding:4px 8px}
  #speed button{width:36px}
  #bar{flex-direction:row;flex-wrap:wrap;align-items:center}
  #seekRow{flex:1 1 100%}
  #transport{flex:1 1 360px}
  #bar>.row{flex:1 1 360px}
  #title{font-size:13px}
  .grp>.lbl{display:none}
}
#cue{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}
#cue.on{opacity:1}#cue .dots{display:flex;gap:14px}#cue .dot{width:16px;height:16px;border-radius:50%;background:#ffd23f;transition:opacity .15s,transform .15s}
#cue .dot.off{opacity:0;transform:scale(.3)}#cue .bar{width:min(60vw,320px);height:5px;border-radius:3px;background:#ffffff26;overflow:hidden}#cue .fill{height:100%;width:0;background:#ffd23f}
#cue .gl{display:none;font:700 13px/1 sans-serif;letter-spacing:.2em;color:#ff2a2a}#cue.growl .dot,#cue.growl .fill{background:#ff2a2a}#cue.growl .gl{display:block}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="app">
  <header id="top">
    <div id="title"></div>
    <a class="yt" id="yt" target="_blank" rel="noopener" title="Open the original song on YouTube"><svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" rx="3.5" fill="#fff"/><path d="M8 4v6l5.2-3z" fill="#d62d20"/></svg><span class="ytl">Original on</span>YouTube</a>
    <button id="setBtn" title="Settings" aria-label="Settings"><span class="ico">⚙</span><span class="t">Settings</span></button>
  </header>
  <div id="cue"><div class="gl">GROWL</div><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="bar"><div class="fill"></div></div></div>
  <main id="stage"><div id="loading">Loading the song…</div></main>
  <footer id="bar">
    <div id="seekRow"><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="tDur">0:00</span></div>
    <div id="transport">
      <button id="prevL" title="Previous line (P)"><span class="ico">⏮</span> Line</button>
      <button id="play" title="Play / pause (Space)">▶ Play</button>
      <button id="nextL" title="Next line (N)">Line <span class="ico">⏭</span></button>
      <button id="loopB" title="Repeat the current line (R)"><span class="ico">🔁</span> <span>Repeat</span></button>
    </div>
    <div class="row">
      <div class="grp" id="voiceGrp"><span class="lbl">Guide voice</span><div class="seg" id="voiceSeg"></div></div>
      <div class="grp" id="speedGrp"><span class="lbl">Speed</span>
        <div id="speed"><button id="spdDown" aria-label="Slower">−</button><span id="spdV">1×</span><button id="spdUp" aria-label="Faster">+</button></div></div>
    </div>
    <div class="row">
      <div class="grp" id="lyrGrp"><span class="lbl">Lyrics</span><select id="lyrSel" aria-label="Lyrics"></select></div>
      <div class="grp" id="recGrp"><span class="lbl">Practice singing</span>
        <div class="btns"><button id="recB" title="Record yourself (use headphones)">⏺ Record me</button><button id="takeB" disabled>▶ My take</button></div></div>
    </div>
    <div id="hint"></div>
  </footer>
</div>
<div id="scrim"></div>
<div id="panel" aria-label="Settings">
  <div id="panelHead"><b>Settings</b><button id="closeBtn" aria-label="Close settings">✕ Close</button></div>
  <h4>Audio</h4>
  <label>Guide voice volume <input id="vocVol" type="range" min="0" max="1" step="0.05"></label>
  <label>Music volume <input type="range" id="instVol" min="0" max="1" step="0.05"></label>
  <label>Lyrics follow guide voice <input type="checkbox" id="lyrFollow"></label>
  <label>Lyrics timing <span style="display:flex;gap:6px;align-items:center"><input type="range" id="off" min="-1.5" max="1.5" step="0.05" style="width:120px"> <b id="offV">0.00s</b></span></label>
  <label>Full screen <button id="fsBtn">⛶ Toggle</button></label>
  <h4>Background</h4>
  <div class="presets" id="presets"></div>
  <label>Mode <select id="bgMode"><option value="solid">Solid color</option><option value="gradient">Gradient</option><option value="image">Image</option></select></label>
  <label>Color 1 <input type="color" id="c1"></label>
  <label>Color 2 <input type="color" id="c2"></label>
  <label>Gradient angle <input type="range" id="ang" min="0" max="360"></label>
  <label>Image file <input type="file" id="img" accept="image/*"></label>
  <label>Image URL <input type="text" id="imgUrl" placeholder="https://…"></label>
  <label>Darken <input type="range" id="dim" min="0" max="0.85" step="0.05"></label>
  <h4>Lyrics</h4>
  <label>Text color <input type="color" id="baseC"></label>
  <label>Highlight color <input type="color" id="hiC"></label>
  <label>Text size <input type="range" id="size" min="22" max="90"></label>
  <button id="reset" style="margin-top:10px">Reset look</button>
  <div class="keys">Keys: Space play/pause · P / N previous / next line · R repeat line · − / + speed · V guide voice · L lyrics · ← / → 5 s · Esc close</div>
</div>
<audio id="player" preload="auto" playsinline></audio>

      case '\u05da':case '\u05db':out+=(dag?'k':'kh')+v;break;
      case '\u05dc':out+='l'+v;break;case '\u05dd':case '\u05de':out+='m'+v;break;case '\u05df':case '\u05e0':out+='n'+v;break;
      case '\u05e1':out+='s'+v;break;case '\u05e2':out+=v||'e';break;
      case '\u05e3':case '\u05e4':out+=(dag?'p':'f')+v;break;
      case '\u05e5':case '\u05e6':out+='ts'+v;break;case '\u05e7':out+='k'+v;break;case '\u05e8':out+='r'+v;break;
      case '\u05e9':out+='sh'+v;break;case '\u05ea':out+=(dag?'t':'s')+v;break;
      default:out+=v}
  }
  return out;
}
if(D.tracks.yi&&!D.tracks.yl){D.tracks.yl={rtl:false,name:'Yiddish (Latin)',lines:D.tracks.yi.lines.map(L=>({start:L.start,end:L.end,text:L.text,words:L.words.map(w=>({w:translit(w.w),start:w.start,end:w.end}))}))}}
const keys=Object.keys(tracks);
const opts=[];
if(tracks.yi&&tracks.yl)opts.push(['yiyl','Yiddish + Latin letters']);
if(tracks.yi)opts.push(['yi','Yiddish']);
if(tracks.yl)opts.push(['yl','Latin letters only']);
if(tracks.yi&&tracks.en)opts.push(['yien','Yiddish + English']);
if(tracks.en)opts.push(['en','English']);
opts.push(['none','Hide lyrics']);
opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;$('lyrSel').appendChild(o)});
if(!S.lyr||!opts.some(o=>o[0]==S.lyr))S.lyr=opts[0][0];

// ================= audio engine =================
const A=$('player');
let ctx=null,gMusic=null,gVoice=null,mixKey=null,take=null;
const canWA=!!(window.AudioContext||window.webkitAudioContext)&&location.protocol!=='file:';
// fallback (opened as a local file, where browsers block Web Audio on media): separate files, gently synced
let FB=null;
if(!canWA){
  A.src=D.audio.instrumental;
  FB={};Object.entries(VT).forEach(([k,v])=>{const a=new Audio(v.src);a.preload='auto';FB[k]=a});
}else setMix(S.vocal==='en'?'en':'yi');
function setMix(k){
  if(!canWA||mixKey===k)return;
  const t=A.currentTime||0,was=!A.paused;mixKey=k;
  A.src=MIX[k];A.load();
  A.addEventListener('loadedmetadata',function f(){A.removeEventListener('loadedmetadata',f);if(t)A.currentTime=t;setRate();if(was)A.play().catch(()=>{})});
}
function ensureCtx(){
  if(!canWA)return;
  if(!ctx){
    const C=window.AudioContext||window.webkitAudioContext;ctx=new C();
    const src=ctx.createMediaElementSource(A),sp=ctx.createChannelSplitter(2);
    gMusic=ctx.createGain();gVoice=ctx.createGain();
    src.connect(sp);sp.connect(gMusic,0);sp.connect(gVoice,1);
    gMusic.connect(ctx.destination);gVoice.connect(ctx.destination);
    applyVol();
  }
  if(ctx.state!=='running')ctx.resume().catch(()=>{});
}
function applyVol(){
  const vv=S.vocal==='none'?0:S.vocVol;
  if(ctx){const n=ctx.currentTime;gMusic.gain.setTargetAtTime(S.instVol,n,.02);gVoice.gain.setTargetAtTime(vv,n,.02)}
  if(FB){A.volume=S.instVol;Object.entries(FB).forEach(([k,a])=>{a.volume=S.vocVol;if(k!==S.vocal&&!a.paused)a.pause()})}
}
const fbVoice=()=>FB&&FB[S.vocal]||null;
function setRate(){
  const r=+S.spd||1;
  [A,...(FB?Object.values(FB):[]),...(take?[take]:[])].forEach(a=>{a.defaultPlaybackRate=r;a.playbackRate=r;if('preservesPitch' in a)a.preservesPitch=true;if('webkitPreservesPitch' in a)a.webkitPreservesPitch=true});
}
function play(){ensureCtx();setRate();A.play().catch(e=>hint('Could not start audio: '+(e.name||e)));const v=fbVoice();if(v){v.currentTime=A.currentTime;v.play().catch(()=>{})}}
function pause(){A.pause();if(FB)Object.values(FB).forEach(a=>a.pause())}
function playPause(){A.paused?play():pause()}
function seek(t){t=Math.max(0,Math.min(t,(A.duration||1e9)-0.05));A.currentTime=t;const v=fbVoice();if(v)v.currentTime=t;render(true)}
// fallback only: keep the separate voice file in step without hard seeks (nudges speed instead)
let lastHard=0;
function fbSync(){
  const v=fbVoice();if(!v)return;const r=+S.spd||1;
  if(A.paused){if(!v.paused)v.pause();return}
  if(v.paused){v.currentTime=A.currentTime;v.play().catch(()=>{});return}
  const d=v.currentTime-A.currentTime,now=performance.now();
  if(Math.abs(d)>0.35&&now-lastHard>1500){v.currentTime=A.currentTime;lastHard=now}
  else if(Math.abs(d)>0.04)v.playbackRate=r*(d>0?0.96:1.04);
  else if(v.playbackRate!==r)v.playbackRate=r;
}
A.addEventListener('play',()=>{$('play').textContent='❚❚ Pause'});
A.addEventListener('pause',()=>{$('play').textContent='▶ Play'});
A.addEventListener('ended',()=>{pause()});
A.addEventListener('waiting',()=>hint('Loading…'));
A.addEventListener('playing',()=>{if($('hint').textContent==='Loading…')hint('')});
A.addEventListener('loadedmetadata',()=>{const l=$('loading');if(l)l.remove();render(true)});
A.addEventListener('error',()=>hint('The audio file could not be loaded.'));

// ---- look
function hexA(h,a){return h+Math.round(a*255).toString(16).padStart(2,'0')}
function applyLook(){
  const bg=$('bg');
  if(S.bgMode==='image'&&S.img){bg.style.background=`url("${S.img}") center/cover no-repeat, ${S.c1}`}
  else if(S.bgMode==='gradient'){bg.style.background=`linear-gradient(${S.ang}deg, ${S.c1}, ${S.c2})`}
  else bg.style.background=S.c1;
  $('shade').style.opacity=S.dim;
  const r=document.documentElement.style;
  r.setProperty('--base',hexA(S.baseC,.55));r.setProperty('--hi',S.hiC);r.setProperty('--size',S.size+'px');
  ['bgMode','c1','c2','ang','dim','baseC','hiC','size','off','instVol','vocVol'].forEach(k=>$(k).value=S[k]);
  $('offV').textContent=(+S.off).toFixed(2)+'s';
  $('lyrSel').value=S.lyr;$('lyrFollow').checked=S.lyrFollow;
  document.querySelectorAll('#voiceSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vocal));
  $('spdV').textContent=(+S.spd)+'×';
  applyVol();save();
}
PRESETS.forEach(p=>{const s=document.createElement('span');s.style.background=p[0]=='solid'?p[1]:`linear-gradient(160deg,${p[1]},${p[2]})`;
  s.onclick=()=>{S.bgMode=p[0];S.c1=p[1];S.c2=p[2];S.baseC=p[1]=='#e9e6df'?'#333333':'#ffffff';applyLook();render(true)};$('presets').appendChild(s)});
['bgMode','c1','c2','ang','dim','baseC','hiC','size','off','instVol','vocVol'].forEach(k=>$(k).addEventListener('input',e=>{S[k]=['ang','dim','size','off','instVol','vocVol'].includes(k)?+e.target.value:e.target.value;applyLook();render(true)}));
$('img').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.img=r.result;S.bgMode='image';applyLook()};r.readAsDataURL(f)};
$('imgUrl').onchange=e=>{S.img=e.target.value.trim();S.bgMode=S.img?'image':S.bgMode;applyLook()};
$('reset').onclick=()=>{const keep={lyr:S.lyr,vocal:S.vocal,spd:S.spd,vocVol:S.vocVol,instVol:S.instVol,lyrFollow:S.lyrFollow};S=Object.assign({},DEF,keep);applyLook();render(true)};
function setPanel(o){$('panel').classList.toggle('open',o);$('scrim').classList.toggle('open',o)}
$('setBtn').onclick=()=>setPanel(!$('panel').classList.contains('open'));
$('closeBtn').onclick=()=>setPanel(false);$('scrim').onclick=()=>setPanel(false);
$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();

// ---- guide voice
vocOpts.forEach(k=>{const b=document.createElement('button');b.dataset.v=k;b.textContent=LABEL[k]||VT[k].label;b.onclick=()=>setVocal(k);$('voiceSeg').appendChild(b)});
function setVocal(k){
  S.vocal=k;
  if(k!=='none')setMix(k);
  if(S.lyrFollow&&k!=='none'&&tracks[k]){ if(k==='en')S.lyr='en'; else if(S.lyr==='en')S.lyr=tracks.yl?'yiyl':'yi'; }
  if(FB){Object.entries(FB).forEach(([kk,a])=>{if(kk!==k)a.pause()});fbSync()}
  applyLook();render(true);
}
$('lyrFollow').onchange=e=>{S.lyrFollow=e.target.checked;applyLook()};
$('lyrSel').onchange=e=>{S.lyr=e.target.value;applyLook();render(true)};

// ---- speed
const SPEEDS=[0.5,0.6,0.7,0.8,0.9,1];
function stepSpeed(d){let i=SPEEDS.indexOf(+S.spd);if(i<0)i=SPEEDS.length-1;i=Math.max(0,Math.min(SPEEDS.length-1,i+d));S.spd=SPEEDS[i];setRate();applyLook()}
$('spdDown').onclick=()=>stepSpeed(-1);$('spdUp').onclick=()=>stepSpeed(1);

// ---- seek bar
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
let seeking=false;
$('seek').oninput=e=>{seeking=true;$('tCur').textContent=fmt(e.target.value/1000*(A.duration||0))};
$('seek').onchange=e=>{seek(e.target.value/1000*(A.duration||0));seeking=false};
$('play').onclick=playPause;

// ---- lyrics rendering
const stage=$('stage');let lastKey='',PL=tracks[tracks.yi?'yi':keys[0]].lines,loopLine=null;
function lineIdx(lines,t){let lo=0,hi=lines.length-1,ans=-1;while(lo<=hi){const m=(lo+hi)>>1;if(lines[m].start-0.15<=t){ans=m;lo=m+1}else hi=m-1}return ans}
// growled (harsh-vocal) lines, keyed by line start time (s); from vocal-stem analysis
const HARSH=new Set([78.775,84.92,92.265,99.59,105.834,141.9,149.905,155.99,163.155,171.241,181.888,199.551,248.435,255.54,262.685,269.149,277.335,284.32,291.105,298.65]);
function mkLine(tr,i,cls){
  const d=document.createElement('div');d.className='line '+cls;d.dir=tr.rtl?'rtl':'ltr';
  const L=tr.lines[i];if(!L){d.innerHTML='&nbsp;';return d}
  L.words.forEach((w,j)=>{const s=document.createElement('span');s.className=HARSH.has(L.start)?'w harsh':'w';s.textContent=w.w;s._w=w;d.appendChild(s);if(j<L.words.length-1)d.appendChild(document.createTextNode(' '))});
  d.onclick=()=>{if(loopLine!=null)setLoop(i);seek(Math.max(0,L.start-0.3-(+S.off)));if(A.paused)play()};return d}
let curSpans=[];
// pre-entry cue: shown when gap before next line > CUE_GAP s
const CUE_GAP=3,CUE_DOTS=3,isHarsh=st=>[...HARSH].some(h=>Math.abs(h-st)<0.6);
let cueEl,cueDots,cueFill,cueSt='';
function cue(lines,t){
  if(!cueEl){cueEl=$('cue');cueDots=[...cueEl.querySelectorAll('.dot')];cueFill=cueEl.querySelector('.fill')}
  let n=lineIdx(lines,t)+1,on=false,st='';
  const L=lines[n];if(L){const gs=n>0?lines[n-1].end:0,gap=L.start-gs,left=L.start-t;
    if(gap>CUE_GAP&&t>=gs&&left>0){const span=Math.max(CUE_DOTS,gap*0.5),from=L.start-Math.min(span,gap);
      if(t>=from){on=true;cueFill.style.width=(Math.min(1,(t-from)/(L.start-from))*100).toFixed(1)+'%';
        const k=Math.ceil(left);cueDots.forEach((d,j)=>d.classList.toggle('off',j>=k));st=isHarsh(L.start)?'on growl':'on'}}}
  if(!on)st='';if(st!==cueSt){cueSt=st;cueEl.className=st}}
function render(force){
  const t=A.currentTime+(+S.off);
  if(!seeking&&A.duration){$('seek').value=A.currentTime/A.duration*1000;$('tCur').textContent=fmt(A.currentTime)}
  $('tDur').textContent=fmt(A.duration);
  if(FB)fbSync();
  if(S.lyr==='none'){if(lastKey!=='none'){stage.innerHTML='';lastKey='none';curSpans=[];if(cueEl){cueEl.className='';cueSt=''}}return}
  const show=S.lyr==='yiyl'?['yi','yl']:S.lyr==='yien'?['yi','en']:[S.lyr];
  const lines=tracks[show[0]].lines;PL=lines;cue(lines,t);
  const i=lineIdx(lines,t);
  if(loopLine!=null&&lines[loopLine]&&!seeking&&!A.paused){const L=lines[loopLine];if(t>L.end+0.6||t<L.start-1.2){const to=Math.max(0,L.start-0.5-(+S.off));A.currentTime=to;const v=fbVoice();if(v)v.currentTime=to;return}}
  let ci=i;if(i<0)ci=0;else if(t>lines[i].end+0.8&&lines[i+1]&&lines[i+1].start-t<3)ci=i+1;
  const key=S.lyr+':'+ci;
  if(force||key!==lastKey){
    lastKey=key;stage.innerHTML='';
    const prev=document.createElement('div');show.forEach((k,n)=>prev.appendChild(mkLine(tracks[k],ci-1,'prev'+(n?' sec':''))));stage.appendChild(prev);
    show.forEach((k,n)=>stage.appendChild(mkLine(tracks[k],ci,'cur'+(n?' sec':''))));
    for(let a=1;a<=(show.length>1?1:2);a++){const nx=document.createElement('div');show.forEach((k,n)=>nx.appendChild(mkLine(tracks[k],ci+a,'next'+(n?' sec':''))));stage.appendChild(nx)}
    curSpans=[...stage.querySelectorAll('.line.cur .w')];
  }
  for(const s of curSpans){const w=s._w;const p=t<=w.start?0:t>=w.end?1:(t-w.start)/Math.max(0.05,w.end-w.start);const v=p.toFixed(3);if(s._p!==v){s._p=v;s.style.setProperty('--p',v)}}
}

// ---- line tools
const curLine=()=>Math.max(0,lineIdx(PL,A.currentTime+(+S.off)));
function goLine(n){const i=Math.min(PL.length-1,Math.max(0,n));if(loopLine!=null)setLoop(i);seek(Math.max(0,PL[i].start-0.3-(+S.off)));if(A.paused)play()}
$('prevL').onclick=()=>{const i=curLine();const t=A.currentTime+(+S.off);goLine(t-PL[i].start>1.5?i:i-1)};
$('nextL').onclick=()=>goLine(curLine()+1);
function setLoop(i){loopLine=i;const b=$('loopB');b.classList.toggle('on',i!=null);b.querySelector('span:last-child').textContent=i==null?'Repeat':'Repeating';b.title=i==null?'Repeat the current line (R)':'Repeating line '+(i+1)+' – tap to stop'}
function toggleLoop(){if(loopLine==null){setLoop(curLine());if(A.paused)play()}else setLoop(null)}
$('loopB').onclick=toggleLoop;

// ---- keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){setPanel(false);return}
  if((e.target.tagName==='INPUT'&&e.target.type==='text')||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();playPause()}
  else if(k==='v'){const i=vocOpts.indexOf(S.vocal);setVocal(vocOpts[(i+1)%vocOpts.length])}
  else if(k==='l'){const i=opts.findIndex(o=>o[0]==S.lyr);S.lyr=opts[(i+1)%opts.length][0];applyLook();render(true)}
  else if(k==='r')toggleLoop();else if(k==='n')$('nextL').click();else if(k==='p')$('prevL').click();
  else if(e.key==='-'||e.key==='_')stepSpeed(-1);else if(e.key==='+'||e.key==='=')stepSpeed(1);
  else if(e.key==='ArrowRight')seek(A.currentTime+5);else if(e.key==='ArrowLeft')seek(A.currentTime-5);
});

// ---- record yourself and listen back over the music
let rec=null,chunks=[],takeT0=0,takeUrl='';
function hint(m){$('hint').textContent=m||''}
$('recB').onclick=async()=>{
  if(rec){rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){hint('Recording is not supported in this browser.');return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    chunks=[];rec=new MediaRecorder(st);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());const type=rec.mimeType||'audio/webm';rec=null;
      if(takeUrl)URL.revokeObjectURL(takeUrl);takeUrl=URL.createObjectURL(new Blob(chunks,{type}));take=new Audio(takeUrl);take.preload='auto';
      $('recB').classList.remove('rec');$('recB').textContent='⏺ Record me';$('takeB').disabled=false;hint('Saved. Tap "My take" to hear yourself over the music.');if(!A.paused)pause()};
    takeT0=A.currentTime;rec.start();$('recB').classList.add('rec');$('recB').textContent='⏹ Stop';hint('Recording… use headphones so the music is not recorded too.');
    if(A.paused)play();
  }catch(err){hint('Microphone blocked or unavailable: '+(err.name||err))}};
$('takeB').onclick=()=>{
  if(!take)return;
  if(!take.paused){take.pause();pause();$('takeB').textContent='▶ My take';return}
  seek(takeT0);take.currentTime=0;setRate();
  take.play();if(A.paused)play();$('takeB').textContent='⏹ Stop take';
  take.onended=()=>{$('takeB').textContent='▶ My take';pause()}};

// ---- keep the screen awake while playing (phones)
let wl=null;async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}}catch(e){}}
A.addEventListener('play',wake);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!A.paused)wake()});

// ---- start
const H=new URLSearchParams(location.hash.slice(1));
if(H.get('voc')&&vocOpts.includes(H.get('voc')))setVocal(H.get('voc'));
if(H.get('lyr')&&opts.some(o=>o[0]==H.get('lyr')))S.lyr=H.get('lyr');
if(H.get('panel')==='1')setTimeout(()=>setPanel(true),0);
A.addEventListener('loadedmetadata',()=>{const t=parseFloat(H.get('t'));if(t>0&&!A.currentTime)seek(t)},{once:true});
setRate();applyLook();render(true);
(function loop(){render(false);requestAnimationFrame(loop)})();
setInterval(()=>{if(document.hidden)render(false)},200); // rAF stops when the screen is off; keep line repeat working
})();
</script>
</body>
</html>
