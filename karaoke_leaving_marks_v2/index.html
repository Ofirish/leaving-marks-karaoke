<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke</title>
<style>
:root{--base:#ffffff8c;--hi:#ffd166;--size:44px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew","Arial Hebrew","David",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:#eee;background:#222}
#bg{position:fixed;inset:0;background:#2b2b2e;background-size:cover;background-position:center;z-index:0;transition:background .3s}
#shade{position:fixed;inset:0;background:#000;opacity:0;z-index:1;pointer-events:none}
#stage{position:fixed;inset:0 0 86px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;z-index:2;padding:0 4vw;text-align:center}
#title{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:2;opacity:.6;font-size:15px;letter-spacing:.06em}
.line{font-size:calc(var(--size)*.62);color:var(--base);line-height:1.35;cursor:pointer;transition:all .25s;min-height:1.35em;max-width:92vw}
.line.cur{font-size:var(--size);font-weight:700;color:var(--base)}
.line.prev{opacity:.45}
.line.sec{font-size:calc(var(--size)*.55);opacity:.85;margin-top:-.2em}
.line.cur.sec{font-size:calc(var(--size)*.6);font-weight:600}
.w{background-image:linear-gradient(to right,var(--hi) calc(var(--p,0)*100%),var(--base) calc(var(--p,0)*100%));-webkit-background-clip:text;background-clip:text;color:transparent}
[dir=rtl] .w{background-image:linear-gradient(to left,var(--hi) calc(var(--p,0)*100%),var(--base) calc(var(--p,0)*100%))}
.gap{opacity:.5;font-size:calc(var(--size)*.5)}
#bar{position:fixed;left:0;right:0;bottom:0;height:86px;z-index:3;background:#0009;backdrop-filter:blur(6px);display:flex;flex-direction:column;justify-content:center;padding:6px 14px;gap:6px}
#row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button,select{background:#ffffff1a;color:#eee;border:1px solid #ffffff33;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
button.on{background:var(--hi);color:#222}
select option{color:#000}
#seek{width:100%}
#time{font-variant-numeric:tabular-nums;font-size:13px;opacity:.8;min-width:96px}
#panel{position:fixed;right:12px;bottom:96px;z-index:4;background:#111d;backdrop-filter:blur(8px);border:1px solid #ffffff22;border-radius:12px;padding:14px;width:300px;display:none;font-size:13px;max-height:calc(100vh - 120px);overflow:auto}
#panel.open{display:block}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:7px 0;gap:8px}
#panel h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.6}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets span{width:30px;height:30px;border-radius:6px;cursor:pointer;border:1px solid #fff4}
input[type=range]{accent-color:var(--hi)}
.spacer{flex:1}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="title"></div>
<div id="stage"></div>
<div id="bar">
  <input id="seek" type="range" min="0" max="1000" value="0">
  <div id="row">
    <button id="play" title="Space">▶ Play</button>
    <span id="time">0:00 / 0:00</span>
    <select id="vocSel" title="V: cycle vocal track"></select>
    <input id="vocVol" type="range" min="0" max="1" step="0.05" value="1" title="Vocal volume" style="width:80px">
    <select id="lyrSel" title="L: cycle lyrics"></select>
    <span class="spacer"></span>
    <button id="fsBtn" title="Fullscreen">⛶</button>
    <button id="setBtn" title="Settings">⚙ Look</button>
  </div>
</div>
<div id="panel">
  <h4>Background</h4>
  <div class="presets" id="presets"></div>
  <label>Mode <select id="bgMode"><option value="solid">Solid color</option><option value="gradient">Gradient</option><option value="image">Image</option></select></label>
  <label>Color 1 <input type="color" id="c1"></label>
  <label>Color 2 <input type="color" id="c2"></label>
  <label>Gradient angle <input type="range" id="ang" min="0" max="360"></label>
  <label>Image <input type="file" id="img" accept="image/*" style="width:170px"></label>
  <label>Image URL <input type="text" id="imgUrl" placeholder="https://… or file" style="width:150px"></label>
  <label>Darken <input type="range" id="dim" min="0" max="0.85" step="0.05"></label>
  <h4>Lyrics</h4>
  <label>Text color <input type="color" id="baseC"></label>
  <label>Highlight color <input type="color" id="hiC"></label>
  <label>Text size <input type="range" id="size" min="22" max="90"></label>
  <label>Sync offset <span><input type="range" id="off" min="-1.5" max="1.5" step="0.05" style="width:110px"> <b id="offV">0.00s</b></span></label>
  <h4>Audio</h4>
  <label>Lyrics follow vocal track <input type="checkbox" id="lyrFollow"></label>
  <label>Music volume <input type="range" id="instVol" min="0" max="1" step="0.05"></label>
  <button id="reset" style="margin-top:8px">Reset look</button>
</div>
<audio id="inst" preload="auto"></audio>
<div id="vocEls"></div>

 "מַיְין", "start": 304.688, "end": 305.346}, {"w": "הוֹיט", "start": 305.346, "end": 305.895}]}], "source": "line-mapped from en", "rtl": true, "breaks": [4, 8, 13, 15, 19, 21, 25], "name": "Yiddish"}}, "audio": {"instrumental": "instrumental.mp3", "vocalTracks": {"en": {"src": "vocals_en.mp3", "label": "English vocals"}, "yi": {"src": "vocals_yi.mp3", "label": "Yiddish vocals (synthetic)"}}}};

<script>
(function(){
const D = window.KARAOKE, $ = id => document.getElementById(id);
const inst=$('inst');
inst.src=D.audio.instrumental;
// vocal tracks: D.audio.vocalTracks = {en:{src,label}, yi:{src,label}}  (v1 data: D.audio.vocals = "file.mp3")
const VT = D.audio.vocalTracks || (D.audio.vocals ? {[D.sung||'en']:{src:D.audio.vocals,label:'Vocals'}} : {});
const VOX = {};
Object.entries(VT).forEach(([k,v])=>{const a=document.createElement('audio');a.preload='auto';a.src=v.src;$('vocEls').appendChild(a);VOX[k]=a});
const vocOpts=[['none','🎤 No vocals (instrumental)'],...Object.entries(VT).map(([k,v])=>[k,'🎤 '+(v.label||k)])];
vocOpts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;$('vocSel').appendChild(o)});
const act=()=>VOX[S.vocal]||null;
$('title').textContent=D.title||''; document.title=(D.title?D.title+' – ':'')+'Karaoke';
const KEY='karaoke-settings-v2';
const DEF={bgMode:'gradient',c1:'#2b2d33',c2:'#4a4e57',ang:160,img:'',dim:0.25,baseC:'#ffffff',hiC:'#ffd166',size:44,off:0,lyr:null,vocal:'none',lyrFollow:true,vocVol:1,instVol:1};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){const t=S.img;S.img='';localStorage.setItem(KEY,JSON.stringify(S));S.img=t}};
const PRESETS=[['solid','#1e1f22','#1e1f22'],['gradient','#2b2d33','#4a4e57'],['gradient','#3a3633','#6b625a'],['gradient','#1c2533','#3d4a5c'],['gradient','#33302b','#5c564b'],['solid','#5a5a5a','#5a5a5a'],['gradient','#0f0f10','#2e2e33'],['solid','#e9e6df','#e9e6df']];
const tracks=D.tracks, keys=Object.keys(tracks);
// lyrics selector
const opts=keys.map(k=>[k,tracks[k].name||k]); if(keys.length>1) opts.push(['both','Both']); opts.push(['none','None']);
opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent='📝 '+t;$('lyrSel').appendChild(o)});
if(!S.lyr||!opts.some(o=>o[0]==S.lyr)) S.lyr=D.sung&&tracks[D.sung]?D.sung:keys[0];
// ---- look
function hexA(h,a){return h+Math.round(a*255).toString(16).padStart(2,'0')}
function applyLook(){
  const bg=$('bg');
  if(S.bgMode==='image'&&S.img){bg.style.background=`url("${S.img}") center/cover no-repeat, ${S.c1}`}
  else if(S.bgMode==='gradient'){bg.style.background=`linear-gradient(${S.ang}deg, ${S.c1}, ${S.c2})`}
  else bg.style.background=S.c1;
  $('shade').style.opacity=S.dim;
  const r=document.documentElement.style;
  r.setProperty('--base',hexA(S.baseC,.55)); r.setProperty('--hi',S.hiC); r.setProperty('--size',S.size+'px');
  ['bgMode','c1','c2','ang','dim','baseC','hiC','size','off','instVol'].forEach(k=>$(k).value=S[k]);
  $('offV').textContent=(+S.off).toFixed(2)+'s';
  $('lyrSel').value=S.lyr; inst.volume=S.instVol; $('vocVol').value=S.vocVol;
  $('vocSel').value=S.vocal; $('lyrFollow').checked=S.lyrFollow;
  Object.entries(VOX).forEach(([k,a])=>{a.volume=S.vocVol; if(k!==S.vocal&&!a.paused)a.pause()});
  const v=act(); if(v&&!inst.paused&&v.paused){v.currentTime=inst.currentTime;v.play().catch(()=>{})}
  save();
}
PRESETS.forEach(p=>{const s=document.createElement('span');s.style.background=p[0]=='solid'?p[1]:`linear-gradient(160deg,${p[1]},${p[2]})`;
  s.onclick=()=>{S.bgMode=p[0];S.c1=p[1];S.c2=p[2];S.baseC=p[1]=='#e9e6df'?'#333333':'#ffffff';applyLook();render(true)};$('presets').appendChild(s)});
['bgMode','c1','c2','ang','dim','baseC','hiC','size','off','instVol'].forEach(k=>$(k).addEventListener('input',e=>{S[k]=['ang','dim','size','off','instVol'].includes(k)?+e.target.value:e.target.value;applyLook();render(true)}));
$('img').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.img=r.result;S.bgMode='image';applyLook()};r.readAsDataURL(f)};
$('imgUrl').onchange=e=>{S.img=e.target.value.trim();S.bgMode=S.img?'image':S.bgMode;applyLook()};
$('reset').onclick=()=>{const l=S.lyr,v=S.vocal;S=Object.assign({},DEF,{lyr:l,vocal:v});applyLook();render(true)};
$('setBtn').onclick=()=>$('panel').classList.toggle('open');
$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
// ---- audio
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const pauseVox=()=>Object.values(VOX).forEach(a=>a.pause());
function playPause(){ if(inst.paused){const v=act();if(v)v.currentTime=inst.currentTime;inst.play();if(v)v.play().catch(()=>{})} else {inst.pause();pauseVox()} }
inst.onplay=()=>$('play').textContent='❚❚ Pause'; inst.onpause=()=>{$('play').textContent='▶ Play';pauseVox()};
inst.onended=pauseVox;
function setVocal(k){S.vocal=k; if(S.lyrFollow&&k!=='none'&&tracks[k]){S.lyr=k} applyLook(); render(true)}
$('play').onclick=playPause;
$('vocSel').onchange=e=>setVocal(e.target.value);
$('lyrFollow').onchange=e=>{S.lyrFollow=e.target.checked;if(S.lyrFollow)setVocal(S.vocal);else applyLook()};
$('vocVol').oninput=e=>{S.vocVol=+e.target.value;applyLook()};
$('lyrSel').onchange=e=>{S.lyr=e.target.value;applyLook();render(true)};
let seeking=false;
$('seek').oninput=()=>{seeking=true};
$('seek').onchange=e=>{seek(e.target.value/1000*(inst.duration||0));seeking=false};
function seek(t){inst.currentTime=t;const v=act();if(v)v.currentTime=t;render(true)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;
  if(e.code==='Space'){e.preventDefault();playPause()} else if(e.key==='v'||e.key==='V'){const i=vocOpts.findIndex(o=>o[0]==S.vocal);setVocal(vocOpts[(i+1)%vocOpts.length][0])}
  else if(e.key==='l'||e.key==='L'){const i=opts.findIndex(o=>o[0]==S.lyr);S.lyr=opts[(i+1)%opts.length][0];applyLook();render(true)}
  else if(e.key==='ArrowRight')seek(inst.currentTime+5); else if(e.key==='ArrowLeft')seek(Math.max(0,inst.currentTime-5));});
// ---- lyrics rendering
const stage=$('stage'); let lastKey='';
function lineIdx(lines,t){ // index of current line: last line whose start <= t (+ small lead)
  let lo=0,hi=lines.length-1,ans=-1; while(lo<=hi){const m=(lo+hi)>>1; if(lines[m].start-0.15<=t){ans=m;lo=m+1}else hi=m-1} return ans }
function mkLine(tr,i,cls){
  const d=document.createElement('div'); d.className='line '+cls; d.dir=tr.rtl?'rtl':'ltr';
  const L=tr.lines[i]; if(!L){d.innerHTML='&nbsp;';return d}
  L.words.forEach((w,j)=>{const s=document.createElement('span');s.className='w';s.textContent=w.w;s._w=w;d.appendChild(s);if(j<L.words.length-1)d.appendChild(document.createTextNode(' '))});
  d.onclick=()=>seek(Math.max(0,L.start-0.3)); return d }
function render(force){
  const t=inst.currentTime+(+S.off);
  if(!seeking&&inst.duration){$('seek').value=inst.currentTime/inst.duration*1000}
  $('time').textContent=fmt(inst.currentTime)+' / '+fmt(inst.duration);
  if(S.lyr==='none'){ if(lastKey!=='none'){stage.innerHTML='';lastKey='none'} return }
  const show=S.lyr==='both'?[D.sung&&tracks[D.sung]?D.sung:keys[0],...keys.filter(k=>k!==(D.sung||keys[0]))]:[S.lyr];
  const P=tracks[show[0]], lines=P.lines;
  let i=lineIdx(lines,t);
  // between lines: if the current line has ended and next one is far, keep showing upcoming line
  let ci=i; if(i<0) ci=0; else if(t>lines[i].end+0.8 && lines[i+1] && lines[i+1].start-t<3) ci=i+1;
  const key=S.lyr+':'+ci;
  if(force||key!==lastKey){
    lastKey=key; stage.innerHTML='';
    const prev=document.createElement('div'); show.forEach((k,n)=>prev.appendChild(mkLine(tracks[k],ci-1,'prev'+(n?' sec':''))));
    stage.appendChild(prev);
    show.forEach((k,n)=>stage.appendChild(mkLine(tracks[k],ci,'cur'+(n?' sec':''))));
    for(let a=1;a<=(show.length>1?1:2);a++){const nx=document.createElement('div');show.forEach((k,n)=>nx.appendChild(mkLine(tracks[k],ci+a,'next'+(n?' sec':''))));stage.appendChild(nx)}
  }
  stage.querySelectorAll('.line.cur .w').forEach(s=>{const w=s._w;const p=t<=w.start?0:t>=w.end?1:(t-w.start)/Math.max(0.05,w.end-w.start);s.style.setProperty('--p',p.toFixed(3))});
  // keep vocals in sync with instrumental
  const v=act(); if(v&&!inst.paused){ if(v.paused){v.currentTime=inst.currentTime;v.play().catch(()=>{})} else if(Math.abs(v.currentTime-inst.currentTime)>0.06){v.currentTime=inst.currentTime} }
}
(function loop(){render(false);requestAnimationFrame(loop)})();
const H=new URLSearchParams(location.hash.slice(1));
if(H.get('voc')&&vocOpts.some(o=>o[0]==H.get('voc'))){S.vocal=H.get('voc');if(S.lyrFollow&&tracks[S.vocal])S.lyr=S.vocal}
if(H.get('lyr')&&opts.some(o=>o[0]==H.get('lyr'))){S.lyr=H.get('lyr')}
inst.addEventListener('loadedmetadata',()=>{const t=parseFloat(H.get('t'));if(t>0)seek(t);render(true)});
applyLook(); render(true);
})();
</script>
